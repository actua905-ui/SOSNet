
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Android project
        run: |
          flutter create -t app --platforms=android --project-name sosnet "$RUNNER_TEMP/sosnet_build"

      - name: Copy SOSNet app files
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/sosnet_build/pubspec.yaml"
          cp -r lib "$RUNNER_TEMP/sosnet_build/lib"

          if [ -d assets ]; then
            cp -r assets "$RUNNER_TEMP/sosnet_build/"
          fi

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/sosnet_build
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ runner.temp }}/sosnet_build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOSNet-APK
          path: ${{ runner.temp }}/sosnet_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
